<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#3a415c">
<title>Southern Concrete Coatings</title>
<link rel="icon" href="logo.png">
<style>
:root{
  --n:#3a415c;
  --g:#424866;
  --dg:#2a3148;
  --c:#212020;
  --bg:#f4f5f7;
  --line:#d5d8e2;
  --gold:#fff3cd;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--c);background:var(--bg)}
header{background:var(--n);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header img{height:48px;width:auto;max-width:42vw;object-fit:contain;object-position:left center;background:#fff;border-radius:8px;padding:2px}
header b{font-size:18px;line-height:1.15;display:block}
header button{margin-left:auto;background:transparent;border:1px solid #c5cad8;color:#fff;border-radius:10px;padding:9px 14px;font-size:14px}
#testbar{background:var(--gold);color:#5c4300;text-align:center;font-weight:700;padding:8px 14px;font-size:14px}
#testbar.bad{background:#fee2e2;color:#7f1d1d;border-bottom-color:#b91c1c}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 1px 4px rgba(17,24,39,.08)}
h2{color:var(--n);margin:4px 0 12px;font-size:22px}
label{display:block;font-weight:700;margin:12px 0 6px}
input,textarea,select{width:100%;font-size:18px;padding:14px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--c)}
.btn{display:block;width:100%;font-size:18px;font-weight:700;padding:16px;margin:12px 0 0;border:0;border-radius:14px;background:var(--g);color:#fff;cursor:pointer}
.btn.n{background:var(--n)}.btn.d{background:var(--dg)}.btn.gr{background:#eef0f4;color:var(--n)}.btn.red{background:#b42318;color:#fff}.btn.huge{font-size:22px;padding:22px}
.btn.nav{font-size:16px;padding:16px 6px}
.btn.sm{font-size:15px;padding:12px}
a.btn{text-decoration:none;text-align:center;color:#fff}
.btn:disabled{opacity:.6}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin button{font-size:28px;padding:20px;border-radius:14px;border:0;background:var(--n);color:#fff;cursor:pointer}
#dots{font-size:34px;text-align:center;letter-spacing:12px;min-height:44px}
.ph{display:flex;flex-wrap:wrap;gap:6px}
.ph img{width:31%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#e8eaf0}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-weight:700;font-size:14px;color:#fff;background:#8a8f98}
.badge.open{background:#9a3412}.badge.paid{background:#2f6b4f}
.row{display:flex;gap:8px}.row .btn{flex:1;min-width:0;padding:16px 6px;font-size:17px}
.acc{background:#fff;border-radius:14px;margin:0 0 12px;box-shadow:0 1px 4px rgba(17,24,39,.08);border:2px solid var(--line);overflow:hidden}
.acch{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:64px;padding:12px 16px;background:#fff;border:0;text-align:left;font-size:18px;color:var(--n);cursor:pointer}
.acch b{font-size:18px}
.acch small{display:block;font-size:14px;color:#5c6370;font-weight:400;margin-top:2px}
.acch i{font-style:normal;font-size:26px;color:var(--g);transition:transform .2s}
.acc.open .acch i{transform:rotate(180deg)}
.acc.open{border-color:var(--g)}
.accb{display:none;padding:4px 16px 16px}
.acc.open .accb{display:block}
#acc-qc{overflow:visible}
.srow{background:#fff;border-radius:14px;margin:0 0 10px;border:2px solid var(--line);box-shadow:0 1px 4px rgba(17,24,39,.08);overflow:hidden}
.srowh{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:12px 14px;background:#fff;border:0;text-align:left;color:var(--n);cursor:pointer}
.srowh span{flex:1;min-width:0}
.srowh b{display:block;font-size:18px}
.srowh small{display:block;margin-top:2px;font-size:14px;font-weight:400;color:#5c6370;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srowh i{flex:0 0 auto;font-style:normal;font-size:28px;line-height:1;color:var(--g);transition:transform .18s}
.srow.open{border-color:var(--g)}
.srow.open .srowh i{transform:rotate(90deg)}
.srowb{display:none;padding:0 14px 14px}
.srow.open .srowb{display:block}
.srowb label:first-of-type{margin-top:2px}
.mic{background:var(--dg)}.mic.on{background:#9a3412}
.muted{color:#5c6370;font-size:14px}
.spec p{margin:8px 0;font-size:18px}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{margin:0;font-weight:700;font-size:17px;border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.checks input{width:22px;height:22px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--n);color:#fff;padding:14px 20px;border-radius:12px;display:none;font-size:17px;z-index:9;max-width:90vw;text-align:center}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:2px solid var(--g);border-radius:12px;box-shadow:0 8px 24px rgba(58,65,92,.18);z-index:30;overflow:hidden}
.sug button{display:block;width:100%;text-align:left;font:inherit;font-size:17px;min-height:56px;padding:14px 16px;border:0;border-bottom:1px solid #eef0f4;background:#fff;color:var(--n)}
.sug button:last-child{border:0}
.sug button:active,.sug button:hover{background:#eef0f8}
.sug .h{padding:12px 16px;color:#5c6370;font-size:14px}
#liveprice{font-size:20px;font-weight:700;color:var(--n)}
a{color:var(--dg)}
.tabs{display:flex;gap:8px;margin:0 0 14px}
.tabs button{flex:1;font:inherit;font-weight:700;font-size:16px;padding:14px 4px;line-height:1.2;border:0;background:#e8eaf0;color:var(--n);border-radius:12px;cursor:pointer}
.tabs button.on{background:var(--n);color:#fff}
.tabs .cnt{display:block;font-size:22px;font-weight:800}
.tabs button.on .cnt{color:#d5d8e4}
.job{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:0;border-radius:16px;padding:16px 18px;margin:0 0 10px;color:var(--c);box-shadow:0 1px 2px rgba(58,65,92,.05),0 4px 12px rgba(58,65,92,.04);cursor:pointer}
.job b{font-size:17px;color:var(--n)}.job .a{color:#5c6370;font-size:14px;margin:3px 0 8px}.job .t{float:right;font-weight:700;color:var(--dg)}
.line{padding:13px 0;border-bottom:1px solid #eef0f4}.line:last-child{border:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eef0f4;font-size:16px}.kv:last-child{border:0}.kv b{color:var(--n)}
.seg{display:flex;border-radius:14px;overflow:hidden;border:1.5px solid var(--n);margin-top:10px}
.seg button{flex:1;font:inherit;font-weight:800;font-size:19px;padding:16px;border:0;background:#fff;color:var(--n);cursor:pointer}
.seg button.on.o{background:#9a3412;color:#fff}.seg button.on.p{background:var(--g);color:#fff}
#rq{position:sticky;z-index:4;max-width:560px;margin:0 auto}#rq:empty{display:none}
.rqi{display:flex;align-items:center;gap:10px;margin:8px 16px 0;padding:13px 14px;border-radius:14px;background:#fff;box-shadow:0 2px 10px rgba(58,65,92,.14);font-size:16px;font-weight:600;color:var(--n)}
.rqi.ok{background:var(--g);color:#fff;cursor:pointer}.rqi.bad{background:#fff6e5;color:#7a5b00;flex-wrap:wrap}
.rqi button{font:inherit;font-size:15px;border:0;border-radius:10px;padding:9px 13px;background:var(--n);color:#fff;cursor:pointer}
.rqi .x{background:transparent;color:#667;padding:4px 8px;font-size:18px}
.spin{width:46px;height:46px;border:4px solid #e3e6ee;border-top-color:var(--g);border-radius:50%;animation:sp .9s linear infinite;margin:18px auto 10px}
.spin.sm{width:22px;height:22px;border-width:3px;margin:0;flex:0 0 22px}
@keyframes sp{to{transform:rotate(360deg)}}
.rpv{display:block;width:100%;max-height:220px;object-fit:contain;border-radius:14px;background:#eef0f4}
.rth{width:60px;height:60px;object-fit:cover;border-radius:10px;background:#eef0f4;flex:0 0 60px}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ggrid button{display:block;padding:0;border:0;background:#fff;border-radius:16px;overflow:hidden;text-align:left;color:var(--n);box-shadow:0 1px 2px rgba(58,65,92,.05),0 4px 12px rgba(58,65,92,.04);cursor:pointer}
.ggrid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#e8eaf0}
.ggrid span{display:block;padding:10px 12px 14px;font-weight:700;font-size:16px}
#gv{position:fixed;inset:0;z-index:40;background:#f4f5f7;display:flex;flex-direction:column;padding:12px 14px 18px}
#gv[hidden]{display:none}
#gv img{flex:1;min-height:0;width:100%;object-fit:contain;background:#fff;border-radius:16px}
#gv h2{margin:10px 0 0;font-size:24px}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Southern Concrete Coatings">
  <div><b>Southern Concrete Coatings</b></div>
  <button id="out" hidden onclick="logout()">Sign out</button>
</header>
<div id="testbar" hidden>Test mode — every email goes only to austin@techsourcedsolutions.com</div>
<div id="rq"></div>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<div id="gv" hidden></div>
<div id="lb" onclick="if(event.target==this)this.style.display='none'" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;align-items:center;justify-content:center;flex-direction:column">
  <img id="lbi" alt="" style="max-width:100%;max-height:80vh">
  <div class="row" style="width:100%;max-width:560px;padding:10px">
    <button class="btn n" onclick="nav(-1)">◀</button>
    <button class="btn gr" onclick="document.getElementById('lb').style.display='none'">✕ Close</button>
    <button class="btn n" onclick="nav(1)">▶</button>
  </div>
</div>
<script src="config.js"></script>
<script src="quote.js"></script>
<script src="gallery.js"></script>
<script src="app.js"></script>
</body>
</html>
